# OVERSEER local infrastructure (P0): PostgreSQL, Redis and an S3-compatible object store.
# Local development only. Everything binds to 127.0.0.1 and uses throwaway credentials.
# Production uses managed services with separate credentials (spec §2, §10.2).
#
#   cp .env.example .env && docker compose up -d --wait
name: overseer

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-overseer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overseer_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-overseer}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible local object storage. MinIO's official images are no longer published on
  # Docker Hub, so this uses Adobe S3Mock (see docs/ADR/0001-toolchain-and-local-infra.md).
  # S3Mock does not validate credentials; production must use a real S3-compatible service.
  # /favicon.ico is documented as always available once S3Mock is serving; `wget` is present
  # in the image. Storage is deliberately ephemeral: S3Mock runs as a non-root user, so a root-owned named
  # volume makes every bucket call fail with HTTP 500. The bucket is recreated at each start.
  objectstore:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-overseer-local}
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:9090'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/favicon.ico']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
