[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infold"
version = "0.2.0"
description = "Infold Core — Structure-aware folding engine for code projects and structured text"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Infold"}]
keywords = ["compression", "folding", "structure-aware", "code-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["infold*"]

[project.scripts]
infold = "infold.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
