name: Build APK

on:
  push:
    branches: [cursor/personal-ai-os-6913, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: inner-way

      - name: Build APK
        working-directory: inner-way
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inner-way-debug
          path: inner-way/app/build/outputs/apk/debug/app-debug.apk
