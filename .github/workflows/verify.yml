name: Verify Infold Build

on:
  push:
    branches: [main, cursor/step-by-step-development-ae9f]
  pull_request:
    branches: [main, cursor/step-by-step-development-ae9f]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Infold
        run: pip install -e .

      - name: Verify Step 1 — CLI and config
        run: python3 -m infold.cli
