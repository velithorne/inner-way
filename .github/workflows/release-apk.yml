# Same pattern as Resonance Map / AuraShell: Gradle debug APK → GitHub Release on version tags.
# No EXPO_TOKEN — only GITHUB_TOKEN (automatic).
#
# Release:
#   git tag v1.0.0-biofield
#   git push origin v1.0.0-biofield
#
# Download: https://github.com/velithorne/inner-way/releases/latest

name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project (Expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools (match Expo prebuild / compileSdk 36)
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Point Gradle at Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare release asset
        run: |
          cp "android/app/build/outputs/apk/debug/app-debug.apk" \
            "BiofieldScanner-${{ github.ref_name }}-debug.apk"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: BiofieldScanner-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
