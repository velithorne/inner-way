# Gradle release APK (JS bundle embedded). Committed android/ includes native PHANTOM WiFi module — do not run expo prebuild here or it may overwrite native sources.
# No EXPO_TOKEN — only GITHUB_TOKEN (automatic).
#
# Release: git tag v* && git push origin v*

name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools (match Expo prebuild / compileSdk 36)
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Point Gradle at Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APK (embeds JavaScript bundle)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare release asset
        run: |
          cp "android/app/build/outputs/apk/release/app-release.apk" \
            "PHANTOM-${{ github.ref_name }}-release.apk"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: PHANTOM-${{ github.ref_name }}-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
