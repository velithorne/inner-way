# Builds a sideloadable debug APK and attaches it to a GitHub Release when you push a version tag.
#
# After merging a phase, tag the commit and push the tag:
#   git tag v1.0.2-phase2
#   git push origin v1.0.2-phase2
#
# Download the latest APK anytime from:
#   https://github.com/<owner>/<repo>/releases/latest

name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare release asset
        run: |
          cp "app/build/outputs/apk/debug/app-debug.apk" \
            "AuraShell-${{ github.ref_name }}-debug.apk"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: AuraShell-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
