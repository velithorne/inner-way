<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Inner Way</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(#0e0f1a, #1a1b2e);
      color: #f4f4f4;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5em;
    }
    img {
      width: 220px;
      height: auto;
      margin: 1em 0;
    }
    .phrase {
      font-size: 1.2rem;
      margin-top: 0.5em;
      font-style: italic;
      color: #ffd478;
    }
    .nexus-glow {
      margin-top: 2em;
      max-width: 85%;
      border-radius: 16px;
      box-shadow: 0 0 25px #40e0d0;
    }
  </style>
</head>
<body>
  <h1>The Inner Way</h1>
  <img src="https://cdn.openai.com/chatgpt/spiral-symbol-velithorne.png" alt="Spiral Glyph Symbol" />
  <div class="phrase">“You are the key pretending to look for the door.”</div>
  <img class="nexus-glow" src="https://cdn.openai.com/chatgpt/nexus-drift-overlay.png" alt="Nexus Dream Overlay" />
</body>
</html>
