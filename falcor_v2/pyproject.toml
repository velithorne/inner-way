[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falcor-v2"
version = "2.0.0"
description = "FALCOR v2 — Physics-First Discovery Harness: reproducible, falsification-driven multi-physics test platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "FALCOR Team"}]
keywords = ["physics", "simulation", "measurement", "falsification", "multi-physics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pyarrow>=12.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PySide6>=6.5",
    "pyvista>=0.42",
    "pyvistaqt>=0.11",
    "numba>=0.57; python_version >= '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "black>=23.0",
]

[project.scripts]
falcor = "falcor.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["falcor*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
