// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Expo modules (e.g. expo-file-system) use safeExtGet("compileSdkVersion") → rootProject.ext
ext {
  compileSdkVersion = (findProperty("android.compileSdkVersion") ?: "36").toInteger()
  targetSdkVersion = (findProperty("android.targetSdkVersion") ?: "36").toInteger()
  minSdkVersion = (findProperty("android.minSdkVersion") ?: "24").toInteger()
  buildToolsVersion = findProperty("android.buildToolsVersion") ?: "36.0.0"
}

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// AGP 8+ requires compileSdk on every Android module; some Expo libs only set compileSdkVersion.
subprojects { sub ->
  sub.afterEvaluate {
    if (!sub.plugins.hasPlugin("com.android.library") && !sub.plugins.hasPlugin("com.android.application")) {
      return
    }
    def a = sub.extensions.findByName("android")
    if (a != null) {
      try {
        a.compileSdk rootProject.ext.compileSdkVersion
      } catch (Exception ignored) {
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
